AWSTemplateFormatVersion: '2010-09-09'

Description: 'Creates an SSM Parameter Store entry that holds the S3 bucket base name for a project and environment'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Common Configuration"
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: "Bucket Configuration"
        Parameters:
          - SSMParamName
          - ParamType
          - SSMParamValue
          - SSMParamDescription
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
          - Tier
          - Policies
    ParameterLabels:
      ProjectName:
        default: "Project Name"
      Environment:
        default: "Environment"
      SSMParamName:
        default: "SSM Parameter Name"
      ParamType:
        default: "SSM Parameter Type"
      SSMParamValue:
        default: "SSM Parameter Value"
      SSMParamDescription:
        default: "SSM Parameter Description"
      CiSuffix:
        default: "CI Suffix"
      Tier:
        default: "SSM Parameter Tier"
      Policies:
        default: "SSM Parameter Policies"

Parameters:
  ProjectName:
    Type: String
    Default: "cfn-nested"
    Description: "Project name used as the top-level SSM parameter path segment"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  Environment:
    Type: String
    Default: devl
    Description: "Deployment environment; used as the second SSM parameter path segment"
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Environment must be lowercase letters, numbers, and hyphens only"

  SSMParamName:
    Type: String
    Default: "test_name"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9_]+$"
    ConstraintDescription: "SSM Parameter name must be 1-20 characters and can only contain lowercase letters, numbers, and underscores"
    Description: "SSM Parameter name"

  ParamType:
    Type: String
    Default: String
    AllowedValues:
      - String
      - StringList
    Description: "Type of the SSM parameter; StringList values must be comma-separated"

  SSMParamValue:
    Type: String
    Default: "ssm_param"
    MinLength: 1
    MaxLength: 4096
    ConstraintDescription: "SSM parameter value must be 1-4096 characters"
    Description: "Value stored in the SSM parameter"

  SSMParamDescription:
    Type: String
    Default: "SSM parameter storing the bucket base name"
    MaxLength: 1024
    ConstraintDescription: "SSM parameter description must be at most 1024 characters"
    Description: "Description attached to the SSM parameter"

  CiSuffix:
    Type: String
    Default: ""
    AllowedPattern: "^[a-z0-9-]*$"
    ConstraintDescription: "CI suffix must be lowercase letters, numbers, and hyphens only, or empty"
    Description: "Optional CI suffix appended to the SSM parameter name when non-empty"

  Tier:
    Type: String
    Default: Standard
    AllowedValues:
      - Standard
      - Advanced
      - Intelligent-Tiering
    Description: "Optional SSM parameter tier; Standard is the default. Advanced and Intelligent-Tiering may incur charges."

  Policies:
    Type: String
    Default: '[{"Type":"Expiration","Version":"1.0","Attributes":{"Timestamp":"2020-05-13T00:00:00.000Z"}},{"Type":"ExpirationNotification","Version":"1.0","Attributes":{"Before":"5","Unit":"Days"}},{"Type":"NoChangeNotification","Version":"1.0","Attributes":{"After":"60","Unit":"Days"}}]'
    Description: "Optional JSON array of SSM parameter policies (for example, an Expiration policy). Only applied when Tier is Advanced and this value is non-empty."

Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  IsAdvancedTier: !Equals [!Ref Tier, Advanced]
  HasPolicies: !Not [!Equals [!Ref Policies, ""]]
  HasAdvancedPolicies: !And [!Condition IsAdvancedTier, !Condition HasPolicies]

Resources:
  SSMParameter:
    Type: AWS::SSM::Parameter
    Metadata:
      com.aws.cloudformation.Context:
        why: "Stores the S3 bucket base name and related settings in SSM Parameter Store under a project/environment path so other stacks and tools can look them up"
        must:
          - "Parameter name must be unique within the AWS account and region"
    Properties:
      Name: !If
        - HasCiSuffix
        - !Sub /${ProjectName}/${Environment}/${SSMParamName}-${CiSuffix}
        - !Sub /${ProjectName}/${Environment}/${SSMParamName}
      Type: !Ref ParamType
      Value: !Ref SSMParamValue
      Description: !Ref SSMParamDescription
      Tier: !Ref Tier
      Policies: !If [HasAdvancedPolicies, !Ref Policies, !Ref AWS::NoValue]
      Tags:
        ManagedBy: CloudFormation
        Project: !Ref ProjectName
        Environment: !Ref Environment

Outputs:
  ParameterPathPrefix:
    Description: "SSM parameter path prefix for this bucket configuration"
    Value: !Sub /${ProjectName}/${Environment}

  BucketBaseNameParameterName:
    Description: "SSM parameter name holding the bucket base name"
    Value: !Ref SSMParameter
